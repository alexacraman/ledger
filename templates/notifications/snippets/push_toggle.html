{% load static %}

  <section class="w-full sm:w-1/2 mx-auto my-12 rounded-2xl bg-gray-50 border border-slate-400 shadow-xl p-6 sm:p-10">
  
  <div class="grid grid-cols-1 sm:grid-cols-3 items-center gap-6 text-center">
    
    <!-- Status -->
    <div class="space-y-3">
      <h4 class="text-sm font-medium text-slate-400 uppercase tracking-wide">
        Status
      </h4>
      <p id="pushStatus" class="text-sm">Checking...</p>
    </div>

    <!-- Icon -->
    <div class="flex justify-center">
      <div class="p-3 rounded-full bg-slate-700">
         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8 animate-pulse">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155" />
        </svg>
      </div>
    </div>

    <!-- Toggle -->
    <div class="space-y-3">
      <h4 class="text-sm font-medium text-slate-400 uppercase tracking-wide">
        Notifications
      </h4>
      <button id="pushToggle" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 transition">
        ...
      </button>
    </div>

  </div>
</section>


{% block extra_js %}
 <script type="module">
    import { initPushNotifications } from "{% static 'js/notifications/notifications.js' %}";
    initPushNotifications("{{ VAPID_PUBLIC_KEY|escapejs }}");
  </script>
{% endblock %}
