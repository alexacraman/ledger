<div class="max-w-sm mx-auto my-12">

  <h1 lass="text-2xl font-bold text-center ">Disable MFA</h1>
  <p lass="text-lg font-semibold text-center my-12 ">For security, please confirm your password to disable MFA.</p>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_div }}
    <div class="flex justify-center">
        <button type="submit" class="outline outline-slate-400  px-6 py-2 rounded-xl hover:rounded-none hover:shadow-white hover:shadow-2xl mr-2 my-4">Disable MFA</button>
    </div>
  </form>
</div>
