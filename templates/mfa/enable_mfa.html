<div class="max-w-md mx-auto p-4 my-12">
  <h2 class="text-lg font-bold mb-2">Scan this QR code with your authenticator app</h2>
  <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code" class="mb-4 border rounded" />
  <p class="mb-4">After scanning, enter the 6-digit code from your app below to confirm MFA setup.</p>

  <form method="POST" action="{% url 'mfa:enable_mfa' %}" class="space-y-4">
    {% csrf_token %}
    <label for="token" class="block text-sm font-medium">Authentication Code</label>
    <input type="text" name="token" id="token" maxlength="6" pattern="\d{6}" required
           class="w-full border border-gray-300 p-2 rounded-md shadow-sm text-slate-700" />

    <div class="flex justify-center">
 <button type="submit" class="outline outline-slate-400  px-6 py-2 rounded-xl hover:rounded-none hover:shadow-white hover:shadow-2xl mr-2 my-4">Verify and Enable MFA</button>
    </div>
   
  </form>
</div>
{% endblock %}
