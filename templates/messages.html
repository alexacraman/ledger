
 {% if messages %}
    <ul class="messages absolute left-4 right-4 top-10 bottom-16 space-y-2 ">
   {% for message in messages %}
    <li {% if message.tags %} class="{{ message.tags }} appear flex items-center rounded shadow-md overflow-hidden max-w-xl relative z-50 bg-gray-100 text-slate-600 border "{% endif %}>
        <div class="self-stretch flex items-center px-3 ">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
            </svg>
        </div>
        <div class="p-4 flex-1">
            <p>{{ message }}</p>
        </div>
        <button type="button" class="closeBtn flex justify-end cursor-pointer p-2" aria-label="Close">x</button>
    </li>
    
    {% endfor %}
    </ul>
    {% endif %}
<script>
    //messages 
const msgContainer = document.querySelector('#msgContainer');
msgContainer.addEventListener('click', (event)=>{
    const msg = event.target.closest('.closeBtn');
    console.log(msg)
    if(!msg) return;
    const wrapper = msg.closest('.appear')
    wrapper.remove()
});
</script>
