{% extends "base.html" %}

{% block content %}

<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm
                dark:border-slate-700 dark:bg-slate-800">

        <h1 class="text-xl font-bold text-gray-900 dark:text-white">
            Delete expense line?
        </h1>

        <p class="mt-3 text-sm text-gray-600 dark:text-gray-400">
            Are you sure you want to delete this expense line?
        </p>


        <div class="mt-4 rounded-lg bg-gray-50 p-4 dark:bg-slate-700">

            <p class="font-medium text-gray-900 dark:text-white">
                {{ line.description }}
            </p>

            <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">
                {{ line.quantity }}
                ×
                £{{ line.unit_price|floatformat:2 }}
            </p>

        </div>


        <form method="post" class="mt-6 flex flex-col gap-3 sm:flex-row">

            {% csrf_token %}

            <button
                type="submit"
                class="rounded-lg bg-red-600 px-5 py-2.5
                       font-medium text-white hover:bg-red-700"
            >
                Delete line
            </button>

            <a
                href="{% url 'accounts:expense_detail' expense.pk %}"
                class="rounded-lg border border-gray-300 px-5 py-2.5
                       text-center text-gray-700 hover:bg-gray-50
                       dark:border-slate-600 dark:text-gray-300
                       dark:hover:bg-slate-700"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
