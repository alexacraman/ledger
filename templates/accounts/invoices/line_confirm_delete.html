{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto">

    <div class="bg-white dark:bg-slate-800 rounded-xl shadow p-6">

        <h1 class="text-xl font-bold text-gray-900 dark:text-white">
            Delete invoice line?
        </h1>

        <p class="mt-3 text-gray-600 dark:text-gray-400">
            Are you sure you want to delete:
        </p>

        <div class="mt-4 rounded-lg bg-gray-50 dark:bg-slate-700 p-4">
            <p class="font-medium text-gray-900 dark:text-white">
                {{ line.description }}
            </p>

            <p class="text-sm text-gray-600 dark:text-gray-300 mt-1">
                {{ line.quantity }} × £{{ line.unit_price }}
            </p>
        </div>

        <form method="post" class="mt-6 flex gap-3">
            {% csrf_token %}

            <button type="submit"
                    class="rounded-lg bg-red-600 px-5 py-2.5
                           text-white font-medium hover:bg-red-700">
                Delete line
            </button>

            <a href="{% url 'accounts:invoice_detail' invoice.pk %}"
               class="rounded-lg border border-gray-300 px-5 py-2.5
                      text-gray-700 hover:bg-gray-50
                      dark:border-slate-600 dark:text-gray-300
                      dark:hover:bg-slate-700">
                Cancel
            </a>
        </form>

    </div>

</div>
{% endblock %}
