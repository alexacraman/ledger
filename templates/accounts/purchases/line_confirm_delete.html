{% extends "base.html" %}

{% block content %}

<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-800">

        <h1 class="text-xl font-bold text-gray-900 dark:text-white">
            Delete line item?
        </h1>

        <p class="mt-3 text-sm text-gray-600 dark:text-gray-300">
            Are you sure you want to delete
            <span class="font-semibold">{{ line.description }}</span>?
        </p>

        <div class="mt-6 flex justify-end gap-3">

            <a
                href="{% url 'accounts:purchase_detail' purchase.pk %}"
                class="rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-50 dark:border-slate-600 dark:bg-slate-700 dark:text-gray-200 dark:hover:bg-slate-600"
            >
                Cancel
            </a>

            <form method="post">
                {% csrf_token %}

                <button
                    type="submit"
                    class="rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-700"
                >
                    Delete
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
