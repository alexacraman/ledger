{% extends 'base.html' %}
{% block title %}title | delete{% endblock %}
{% block content %}
<section class="p-6 max-w-sm mx-auto my-24">
    <div class="grid grid-cols-3 bg-red-200 mx-auto">
        <div class="col-span-1 bg-red-600 flex justify-center items-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-10 h-10 text-red-900">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
              </svg>
              
        </div>
        <div class="col-span-2 text-gray-900 p-2">
            <a  class='text-black' href="{% url 'tasks:tasks' %}"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12h-15m0 0l6.75 6.75M4.5 12l6.75-6.75" />
              </svg>
              </a>
            <p class="p-2">Are you sure you want to delete?</p>
            <form method="POST">
                {% csrf_token %}
                {{form}}
                <div class="flex justify-center">
                    <button type="submit" class="border bg-red-500 hover:bg-red-700 py-2 px-4 rounded-md my-6">Confirm</button>
                </div>
            </form>
        </div>
    </div>
  
</section>



{% endblock %}
