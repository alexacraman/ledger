<div class="px-5 py-5">

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                        <!-- Description -->
                        <div class="lg:col-span-2">
                            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                                Task Description
                            </h3>

                            <p class="text-sm leading-6 text-slate-600 whitespace-pre-line">
                                {{ record.task_description }}
                            </p>
                        </div>

                        <!-- Details -->
                        <div class="lg:border-l lg:border-slate-200 lg:pl-6">

                            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">
                                Details
                            </h3>

                            <dl class="space-y-2 text-sm">

                                {% if record.notes %}
                                    <div>
                                        <dt class="inline font-medium text-slate-700">
                                            Notes:
                                        </dt>
                                        <dd class="inline text-slate-500">
                                            {{ record.notes }}
                                        </dd>
                                    </div>
                                {% endif %}

                                <div>
                                    <dt class="inline font-medium text-slate-700">
                                        Logged:
                                    </dt>
                                    <dd class="inline text-slate-500">
                                        {{ record.created_at|date:"d M Y, H:i" }}
                                    </dd>
                                </div>

                            </dl>

                        </div>

                    </div>

                </div>
